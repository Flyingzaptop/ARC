name: Stage 2A.1 bootstrap syntax
permissions:
  contents: read
on:
  push:
    branches: [dev/stage2a1-oneclick-bootstrap]
  pull_request:
    branches: [dev/stage2a1-oneclick-bootstrap]
jobs:
  parse:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell bootstrap v2
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'scripts/stage2a1-bootstrap-v2.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -ne 0) {
            $errors | Format-List | Out-String | Write-Error
            exit 1
          }
